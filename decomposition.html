<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>D&eacute;composition - Zone BROUILLON</title>
    <style>
        :root {
            --blue: #60a5fa;
            --white: #ffffff;
            --dark: rgba(30,30,30,0.4);
            --panel: rgba(30,30,30,0.6);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            color: var(--white);
            background: url('30.png') center/cover fixed no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .page {
            width: min(100%, 980px);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(30,30,30,0.45);
            backdrop-filter: blur(8px);
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }
        .header h1 {
            margin: 0;
            font-size: clamp(1.4rem, 2vw, 2rem);
            line-height: 1.1;
        }
        .header button {
            border: none;
            border-radius: 999px;
            background: var(--blue);
            color: var(--white);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 150ms ease, background 150ms ease;
        }
        .header button:hover {
            transform: translateY(-1px);
            background: #3b82f6;
        }
        canvas {
            width: 100%;
            height: auto;
            max-width: 760px;
            aspect-ratio: 2 / 3;
            border: 2px solid rgba(255,255,255,0.9);
            border-radius: 18px;
            background: rgba(30,30,30,0.4);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: transparent;
            padding: 16px;
            z-index: 10;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            width: min(100%, 420px);
            padding: 24px;
            border-radius: 20px;
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 24px 80px rgba(0,0,0,0.55);
        }
        .modal-card h2 {
            margin: 0 0 12px;
            font-size: 1.45rem;
        }
        .modal-card p {
            margin: 0 0 20px;
            color: #d1d5db;
            line-height: 1.5;
        }
        .modal-card label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #e2e8f0;
        }
        .modal-card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .modal-card input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(96,165,250,0.16);
        }
        .modal-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }
        .modal-buttons button {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        .modal-buttons .confirm {
            background: var(--blue);
            color: var(--white);
        }
        .modal-buttons .cancel {
            background: rgba(255,255,255,0.1);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.16);
        }
        @media(max-width: 700px) {
            .page { padding: 18px; }
            .header { flex-direction: column; align-items: stretch; }
            .header button { width: 100%; }
            .modal-card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>Décomposition de <span id="currentValueLabel">54</span></h1>
            <button id="newNumberButton">Nouvelle décomposition</button>
        </div>
        <canvas id="canvas" width="400" height="600"></canvas>
        <div class="answer-panel">
            <p class="rule-text">Règle : décompose le nombre en produit de nombres premiers, puis écris la même décomposition en puissances.</p>
            <input id="answerInput" type="text" placeholder="Ex: 2^1 × 3^3 ou 2 × 3 × 3 × 3" />
            <button id="checkButton">Vérifier ma réponse</button>
            <p class="feedback-message" id="feedbackMessage"></p>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <h2>Nouvelle décomposition</h2>
            <p>Choisis un nombre entier supérieur ou égal à 2 pour recommencer la décomposition.</p>
            <label for="modalInput">Nombre</label>
            <input id="modalInput" type="number" min="2" value="54" />
            <div class="modal-buttons">
                <button class="confirm" id="applyButton">D&eacute;composer</button>
                <button class="cancel" id="closeButton">Fermer</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const currentValueLabel = document.getElementById('currentValueLabel');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalInput = document.getElementById('modalInput');
        const newNumberButton = document.getElementById('newNumberButton');
        const applyButton = document.getElementById('applyButton');
        const closeButton = document.getElementById('closeButton');
        const answerInput = document.getElementById('answerInput');
        const checkButton = document.getElementById('checkButton');
        const feedbackMessage = document.getElementById('feedbackMessage');

        let timer = 0;
        let animationFinished = false;
        let currentNumber = 54;
        let events = [];
        let maxTime = 0;

        function primeFactorization(n) {
            const factors = [];
            for (let i = 2; i * i <= n; i++) {
                while (n % i === 0) {
                    factors.push(i);
                    n /= i;
                }
            }
            if (n > 1) factors.push(n);
            return factors;
        }

        function formatPowerExpression(factors) {
            const counts = {};
            for (const factor of factors) {
                counts[factor] = (counts[factor] || 0) + 1;
            }
            return Object.entries(counts)
                .map(([prime, exp]) => exp > 1 ? `${prime}^${exp}` : prime)
                .join(' × ');
        }

        function generateEvents(number) {
            const factors = primeFactorization(number);
            const events = [];
            let timeOffset = 20;
            const stepBaseY = 80;
            const rowHeight = 40;
            let stepIndex = 0;
            let currentValue = number;

            events.push({ type: 'text', text: String(number), x: 150, y: stepBaseY, start: timeOffset, duration: 120, options: { color: 'white', font: 'bold 24px sans-serif' } });
            timeOffset += 130;

            events.push({ type: 'line', start: timeOffset });
            timeOffset += 20;

            for (let i = 0; i < factors.length; i++) {
                const factor = factors[i];
                const nextValue = currentValue / factor;
                const rowY = stepBaseY + stepIndex * rowHeight;

                events.push({ type: 'text', text: String(factor), x: 230, y: rowY, start: timeOffset, duration: 80, options: { color: 'white', font: 'bold 24px sans-serif' } });
                timeOffset += 160;

                events.push({ type: 'text', text: `${currentValue} \u00F7 ${factor} = ${nextValue}`, isCalculation: true, x: 260, y: 95, start: timeOffset, duration: 120, options: { color: '#1e293b', font: 'bold 16px sans-serif' } });
                timeOffset += 100;

                currentValue = nextValue;
                stepIndex++;

                events.push({ type: 'text', text: String(nextValue), x: 150, y: stepBaseY + stepIndex * rowHeight, start: timeOffset, duration: 120, options: { color: 'white', font: 'bold 24px sans-serif' } });
                timeOffset += 140;
            }

            const factorText = factors.join(' × ');
            const powerText = formatPowerExpression(factors);
            const responseText = `Réponse : ${number} = ${factorText}`;
            events.push({ type: 'text', text: responseText, x: 80, y: 340, start: timeOffset, duration: 140, options: { color: 'white', font: 'bold 18px sans-serif' } });
            timeOffset += 120;
            events.push({ type: 'text', text: `En puissances : ${number} = ${powerText}`, x: 80, y: 380, start: timeOffset, duration: 140, options: { color: '#d1d5db', font: 'bold 18px sans-serif' } });

            return events;
        }

        function updateEvents(number) {
            currentNumber = number;
            currentValueLabel.textContent = number;
            modalInput.value = number;
            events = generateEvents(number);
            maxTime = Math.max(...events.map(e => e.start + (e.duration || 0))) + 100;
            timer = 0;
            animationFinished = false;
            feedbackMessage.textContent = '';
        }

        function showDialog() {
            modalOverlay.classList.add('active');
            modalInput.focus();
        }

        function hideDialog() {
            modalOverlay.classList.remove('active');
        }

        function isPrime(n) {
            if (n < 2) return false;
            for (let i = 2; i * i <= n; i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function parseAnswerInput(input) {
            const normalized = input
                .trim()
                .replace(/\s+/g, '')
                .replace(/×|·/g, '*')
                .replace(/x(?!\^)/gi, '*');
            if (!normalized) return null;

            const tokens = normalized.split('*').filter(Boolean);
            const factors = [];

            for (const token of tokens) {
                const [base, exp] = token.split('^');
                const prime = parseInt(base, 10);
                if (!Number.isInteger(prime) || prime < 2 || !isPrime(prime)) {
                    return null;
                }
                if (exp === undefined) {
                    factors.push(prime);
                } else {
                    const exponent = parseInt(exp, 10);
                    if (!Number.isInteger(exponent) || exponent < 1) {
                        return null;
                    }
                    for (let i = 0; i < exponent; i++) {
                        factors.push(prime);
                    }
                }
            }
            return factors;
        }

        function compareFactorLists(a, b) {
            if (a.length !== b.length) return false;
            a = [...a].sort((x, y) => x - y);
            b = [...b].sort((x, y) => x - y);
            return a.every((value, index) => value === b[index]);
        }

        function checkAnswer() {
            const answer = answerInput.value;
            const userFactors = parseAnswerInput(answer);
            if (!userFactors) {
                feedbackMessage.textContent = 'Format incorrect : utilise des nombres premiers et × ou ^.';
                feedbackMessage.style.color = '#f87171';
                return;
            }
            const expectedFactors = primeFactorization(currentNumber);
            if (compareFactorLists(userFactors, expectedFactors)) {
                feedbackMessage.textContent = 'Bravo ! Ta décomposition est correcte.';
                feedbackMessage.style.color = '#4ade80';
            } else {
                feedbackMessage.textContent = 'Ce n’est pas la bonne décomposition. Réessaie.';
                feedbackMessage.style.color = '#f87171';
            }
        }

        function applyNewNumber() {
            const value = parseInt(modalInput.value, 10);
            if (!Number.isInteger(value) || value < 2) {
                modalInput.focus();
                return;
            }
            hideDialog();
            updateEvents(value);
        }

        newNumberButton.addEventListener('click', showDialog);
        applyButton.addEventListener('click', applyNewNumber);
        closeButton.addEventListener('click', hideDialog);
        modalInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                applyNewNumber();
            }
        });
        checkButton.addEventListener('click', checkAnswer);
        answerInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        });

        function drawTextProgress(text, x, y, start, duration, options = {}) {
            const elapsed = timer - start;
            if (elapsed < 0) return;
            const progress = Math.min(1, elapsed / duration);
            const count = Math.floor(progress * text.length);
            if (count <= 0) return;
            ctx.fillStyle = options.color || 'white';
            ctx.font = options.font || 'bold 24px sans-serif';
            ctx.fillText(text.slice(0, count), x, y);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillRect(250, 40, 130, 80);
            ctx.strokeStyle = '#334155';
            ctx.strokeRect(250, 40, 130, 80);
            ctx.fillStyle = '#cbd5e1';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText('BROUILLON :', 260, 60);

            const brouillonCalculs = events.filter(event => event.isCalculation && timer >= event.start);
            if (brouillonCalculs.length > 0) {
                const activeCalcul = brouillonCalculs[brouillonCalculs.length - 1];
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.fillRect(251, 71, 128, 48);
                drawTextProgress(activeCalcul.text, activeCalcul.x, activeCalcul.y, activeCalcul.start, activeCalcul.duration, activeCalcul.options);
            }

            for (const event of events) {
                if (event.type === 'line') {
                    if (timer >= event.start) {
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(200, 50);
                        ctx.lineTo(200, 300);
                        ctx.stroke();
                    }
                } else if (event.type === 'text') {
                    if (!event.isCalculation) {
                        drawTextProgress(event.text, event.x, event.y, event.start, event.duration, event.options);
                    }
                }
            }

            if (timer >= maxTime && !animationFinished) {
                animationFinished = true;
                setTimeout(showDialog, 500);
            }

            timer++;
            requestAnimationFrame(draw);
        }

        updateEvents(currentNumber);
        draw();
    </script>
</body>
</html>
