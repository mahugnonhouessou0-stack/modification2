<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>3o</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jakarta+Sans:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/mathlive"></script>
    <link rel="stylesheet" href="cahier.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- Configuration MathJax -->
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="dlg-shell" id="shell">
      <div class="dlg-header">
        <div class="dlg-avatar" id="hdr-av">C</div>
        <div>
          <div class="dlg-name" id="hdr-name">Camélia</div>
          <div class="dlg-status"><span class="dlg-dot"></span> En ligne avec vous</div>
        </div>
        <button class="dlg-min-btn" id="dlg-min-btn" title="Réduire / Agrandir">—</button>
      </div>
      <div class="dlg-body" id="dlg-body"></div>
      <div class="dlg-footer">
        <div class="dlg-q-label" id="q-label"></div>
        <div class="dlg-choices" id="choices"></div>
      </div>
    </div>

    <div class="board-frame">
        <div id="tableau-topbar" class="tableau-topbar">
            <div id="tableau-countdown" class="tableau-countdown">15:00</div>
        </div>
        <canvas id="boardCanvas"></canvas>
        <canvas id="threeCanvas" style="position:absolute; top:0; left:0; pointer-events:none; display:none;"></canvas>

        <div id="search-box" class="search-dialog" aria-hidden="true">
            <!-- Barre de recherche en haut -->
            <div class="search-top-bar">
                <button id="search-toggle-filter-btn" type="button" class="search-filter-toggle">
                    <span class="search-filter-toggle-icon" aria-hidden="true">
                        <svg viewBox="0 0 512 512" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M463.1 0H48.9C36.6 0 26 10.6 26 23.9c0 6.3 2.6 12.3 7.1 16.6l156.8 148.1V320c0 13.7 7.7 26.2 20.1 32.2l96 41.6c13.3 5.8 28.8 1 37.6-12.3 8.8-13.3 8.8-30.8 0-44.1L285.1 320V188.6L469.9 40.5c4.4-4.3 7.1-10.3 7.1-16.6C476 10.6 465.4 0 453.1 0z"/>
                        </svg>
                    </span>
                    <span>Filtre</span>
                    <span class="search-filter-toggle-arrow">▾</span>
                </button>
                <div class="search-input-wrapper">
                    <div id="search-filters-chips" class="search-filters-chips"></div>
                    <input id="search-input" type="text" placeholder="Rechercher une notion." autocomplete="off" class="search-input-top" />
                </div>
                <button id="search-close" type="button" class="search-close-btn">×</button>
            </div>

            <div class="search-container">
                <!-- Remplacement de : <div class="search-filters-panel" aria-hidden="true"></div> -->
    <div class="search-filters-panel">
        <!-- Le conteneur slider qui se déplace horizontalement (translateX) -->
        <div id="dropdownSlider" class="search-dropdown-slider">
            
            <!-- Étape 1 : Choix du type (SA ou Séquence de cours) -->
            <!-- Ce panneau est automatiquement peuplé par la fonction renderFilters() de search.js -->
            <div id="dropdownStep1" class="search-step-pane">
                <!-- Injecté dynamiquement par le script de recherche -->
            </div>

            <!-- Étape 2 : Sélection précise (Boutons SA1, SA2 ou S01, S02...) -->
            <!-- Ce panneau est automatiquement peuplé par la fonction renderStep2() de search.js -->
            <div id="dropdownStep2" class="search-step-pane">
                <!-- Injecté dynamiquement par le script de recherche -->
            </div>

        </div>
    </div>

                <!-- Panel des résultats à droite -->
                <div class="search-results-panel">
                    <div id="search-count" class="search-count"></div>
                    <div id="search-results" class="search-results-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="cahier" class="cahier-bulle">

        <!-- Header -->
        <div id="cahier-header">
            <span id="cahier-title">✏️ Cahier</span>
            <div id="cahier-size-btns">
                <button data-size="bulle" title="Réduire">⬤</button>
                <button data-size="petit" title="Petit">▪</button>
                <button data-size="moyen" title="Moyen">▬</button>
                <button data-size="plein" title="Plein écran">⛶</button>
            </div>
        </div>

        <!-- Zone d'écriture -->
        <div id="cahier-body">
            <div class="cahier-math-row">
                <div class="cahier-math-field">
                    <math-field id="cahier-math-input" virtual-keyboard-mode="manual" placeholder=" "></math-field>
                </div>
            </div>
        </div>

        <div id="cahier-keyboard"></div>

        <!-- Bouton envoyer -->
        <button id="cahier-send">Envoyer ✓</button>

    </div>

    <div class="controls">
        <button id="replayBtn">Rejouer</button>
        <button id="switchBtn">Changer de scène</button>
        <button id="pausePlayBtn">Pause</button>
        <div class="speed-control">
            <span>Vitesse:</span>
            <input type="range" id="speedSlider" min="0.1" max="2" step="0.1" value="1">
        </div>
        <div class="color-control">
            <span>Tableau:</span>
            <select id="colorSelect">
                <option value="#1c3826">Vert Forêt</option>
                <option value="#2c3e50">Noir Ardoise</option>
                <option value="#1a1a1a">Noir Profond</option>
            </select>
        </div>
    </div>

    <!-- En mode module, on ne charge que le point d'entrée -->
    <script type="module" src="search.js"></script>
    <script type="module" src="moteur.js"></script>
    <script src="cahier.js"></script>
</body>
</html>
